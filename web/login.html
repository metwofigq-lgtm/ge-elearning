<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso administrativo — GE E-Learning</title><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f1f5fb;color:#16325a;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.panel{width:100%;max-width:420px;background:white;border:1px solid #dce6f3;border-radius:18px;padding:32px;box-shadow:0 14px 45px #16325a12}h1{font-size:26px;margin:0 0 8px}p{color:#60728b;line-height:1.5}label{display:block;font-weight:600;margin-top:20px;font-size:14px}input{width:100%;padding:13px;border:1px solid #b9cbe2;border-radius:9px;margin-top:8px;font-size:16px}button{width:100%;background:#123b73;color:white;border:0;border-radius:9px;padding:14px;margin-top:24px;font-size:16px;font-weight:700}a{color:#285eab;text-decoration:none}.brand{font-weight:800;color:#123b73;margin-bottom:25px}.note{font-size:12px;margin-top:22px}</style></head><body><main class="panel"><div class="brand">GE E-Learning</div><h1>Acceso de administrador</h1><p>Entra en el panel de gestión de la plataforma.</p><form method="post" action="/login"><label>Usuario<input name="username" autocomplete="username" required maxlength="100"></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Iniciar sesión</button></form><p class="note">Acceso de prueba. Las cuentas se configuran de forma segura en el servidor.</p><a href="/">Volver al inicio</a></main></body></html>
